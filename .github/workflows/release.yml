name: Publish NPM Package

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@SergeyBondar93'

      - name: Fetch all tags
        run: git fetch --tags --force

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: npm ci

      - name: Build
        working-directory: npm-package
        run: npm run build

      # Stable release (main / develop)
      - name: Create stable release tag
        if: github.ref_name == 'main' || github.ref_name == 'develop'
        working-directory: npm-package
        run: node ../scripts/release-stable.js "${{ inputs.release_type }}"

      # Feature-branch release
      - name: Create feature branch tag
        if: github.ref_name != 'main' && github.ref_name != 'develop'
        working-directory: npm-package
        run: node ../scripts/release-feature.js "${{ github.ref_name }}"
